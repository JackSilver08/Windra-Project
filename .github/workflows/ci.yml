name: Windra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    container: debian:13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            cmake \
            ninja-build \
            g++ \
            qt6-base-dev \
            golang-go

      - name: Configure Qt unit tests
        run: |
          cmake -S . -B build-tests -G Ninja \
            -DBUILD_TESTING=ON \
            -DWINDRA_BUILD_TESTS=ON \
            -DWINDRA_BUILD_SHELL=OFF \
            -DWINDRA_BUILD_SETTINGS=OFF \
            -DWINDRA_BUILD_FILES=OFF \
            -DWINDRA_BUILD_CALC=OFF \
            -DWINDRA_BUILD_NOTES=OFF

      - name: Build Qt unit tests
        run: cmake --build build-tests

      - name: Run Qt unit tests
        run: ctest --test-dir build-tests --output-on-failure

      - name: Go tests and vet
        run: |
          (cd services/health && go test ./... && go vet ./...)
          (cd services/webapps && go test ./... && go vet ./...)

      - name: Shell syntax checks
        run: find tools -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

  powershell-launchers:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell launchers
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem tools -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "PowerShell parse errors in $($_.Name): $($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }

      - name: Test Windows to WSL path conversion
        shell: pwsh
        run: |
          . ./tools/wsl-path.ps1

          $cases = @(
            @{ Windows = 'C:\Windra-Project'; Linux = '/mnt/c/Windra-Project' },
            @{ Windows = 'D:\Windra Project\repo'; Linux = '/mnt/d/Windra Project/repo' }
          )

          foreach ($case in $cases) {
            $actual = ConvertTo-WindraWslPath -WindowsPath $case.Windows
            if ($actual -ne $case.Linux) {
              throw "Path conversion failed: $($case.Windows) -> $actual; expected $($case.Linux)"
            }
          }

  shell-smoke:
    runs-on: ubuntu-latest
    container: debian:13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt/QML build and runtime dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            cmake \
            ninja-build \
            g++ \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-svg-plugins \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window \
            qml6-module-qtquick-dialogs \
            coreutils

      - name: Configure Windra Shell
        run: |
          cmake -S . -B build-shell -G Ninja \
            -DBUILD_TESTING=OFF \
            -DWINDRA_BUILD_TESTS=OFF \
            -DWINDRA_BUILD_SHELL=ON \
            -DWINDRA_BUILD_SETTINGS=OFF \
            -DWINDRA_BUILD_FILES=OFF \
            -DWINDRA_BUILD_CALC=OFF \
            -DWINDRA_BUILD_NOTES=OFF

      - name: Build Windra Shell
        run: cmake --build build-shell --target windra-shell

      - name: Headless QML smoke test
        shell: bash
        run: |
          set +e
          timeout 5s env \
            QT_QPA_PLATFORM=offscreen \
            QT_QUICK_BACKEND=software \
            WINDRA_WIFI_MOCK=1 \
            ./build-shell/shell/windra-shell --windowed
          code=$?
          set -e

          # 124 = timeout after 5 seconds, meaning the event loop stayed alive.
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "Windra Shell headless smoke test failed with exit code $code" >&2
            exit "$code"
          fi
